---
deployment:
  tasks:
    - export DEPLOYPATH=/home/legadoholding/public_html/funerzul
    # Cuenta de FDZ (migración a www.funerariadelzulia.com): ensayo en public_html/nuevo.funerariadelzulia.com (cPanel no deja raíces fuera de public_html); en el corte, public_html.
    - 'if [ "$(/usr/bin/id -un)" = "funerariadelzuli" ]; then export DEPLOYPATH=/home/funerariadelzuli/public_html/nuevo.funerariadelzulia.com; fi'
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R index.php crematorios-del-zulia.php obituarios.php obituario.php obituario_og.php o.php nosotros.php directorio-medico.php medico.php recursos.php recurso.php sitemap.php robots.txt .htaccess styles.css app.js admin.js admin-manual.js admin.html favicon.png logo.png logo-horizontal-white.png logo-seal-footer.png api partials servicios planes img assets uploads cache manual $DEPLOYPATH
    - /bin/rm -f $DEPLOYPATH/index.html
